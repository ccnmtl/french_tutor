name: build-and-test
on: [push]

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8==7.3.0

      - name: Lint
        run: flake8

  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t french_tutor:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name french_tutor-smoke -p 8000:8080 \
            -e OPENAI_API_KEY=placeholder-not-used-by-these-checks \
            french_tutor:ci \
            make runserver
