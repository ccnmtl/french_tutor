<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Practice — French AI Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/vocab2.css" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      French AI Tutor
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
    </div>
  </nav>

  <main class="app-layout">

    <!-- ── LEFT PANEL ─────────────────────────────── -->
    <section class="app-left">
    <div class="left-card">

      <!-- AVATAR STAGE -->
      <div class="avatar-stage" id="avatarStage">

        <!-- idle / pre-connect screen -->
        <div class="avatar-idle-wrap" id="avatarIdleWrap">
          <div class="avatar-orb" id="tutorAvatar">
            <div class="orb-ring orb-ring1"></div>
            <div class="orb-ring orb-ring2"></div>
            <div class="orb-ring orb-ring3"></div>
            <div class="orb-face orb-photo">
              <img src="images/avatar.jpg" alt="Professeur Dominique" />
            </div>
          </div>
          <p class="avatar-name">Professeur Dominique</p>
          <p class="avatar-subtitle">Grammar Practice</p>
          <button class="btn-start-connect" id="btnConnect">
            <i class="fas fa-play-circle"></i> Start Session
          </button>
        </div>

        <!-- active session overlay -->
        <div class="avatar-active-wrap" id="avatarActiveWrap" style="display:none">
          <div class="avatar-orb active" id="tutorAvatarActive">
            <div class="orb-ring orb-ring1"></div>
            <div class="orb-ring orb-ring2"></div>
            <div class="orb-ring orb-ring3"></div>
            <div class="orb-face orb-photo">
              <img src="images/avatar.jpg" alt="Professeur Dominique" />
            </div>
          </div>
          <p class="avatar-name">Professeur Dominique</p>
          <span class="status-pill" id="statusPill">Connecting…</span>
          <button class="btn-end-sm" id="btnEnd" style="display:none">
            <i class="fas fa-stop-circle"></i> End Session
          </button>
        </div>

      </div><!-- /avatar-stage -->

      <!-- CHAT ZONE -->
      <div class="chat-zone">
        <div class="transcript-box" id="transcriptBox">
          <div class="transcript-empty">
            <i class="fas fa-book-open"></i>
            <p>Click <strong>Start Session</strong> above.<br>The conversation will appear here.</p>
          </div>
        </div>
        <button class="btn-speak" id="btnSpeak" disabled style="display:none">
          <i class="fas fa-microphone"></i>
          <span id="speakLabel">Click to Speak</span>
        </button>
      </div>

    </div><!-- /left-card -->
    </section>

    <!-- ── RIGHT PANEL: Grammar Correction Panel ──── -->
    <aside class="app-right">
      <div class="panel-header">
        <i class="fas fa-graduation-cap"></i>
        <span class="panel-title">Grammar Corrections</span>
        <button class="btn-download" id="btnDownload">
          <i class="fas fa-download"></i> Download
        </button>
      </div>
      <div class="correction-feed" id="correctionFeed">
        <div class="feed-empty">
          <i class="fas fa-clipboard-check"></i>
          <p>Grammar corrections will appear here after you speak.</p>
        </div>
      </div>
    </aside>

  </main>

  <!-- Evaluation modal -->
  <div class="modal-bg" id="evalModal" style="display:none">
    <div class="modal-card">
      <div class="modal-top">
        <span><i class="fas fa-chart-bar"></i> Session Evaluation</span>
        <button id="btnCloseModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="evalBody">Generating…</div>
    </div>
  </div>

  <script src="js/api-key.js"></script>
<script src="js/openai-ws-rest.js"></script>
<script src="js/grammar.js"></script>
</body>
</html>
